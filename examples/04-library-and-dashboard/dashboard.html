<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twinzies (sample)</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--fg:#1c1b19;--muted:#5d5a53;--line:#e2ded6;--accent:#2d5b4f;--accent-fg:#fff;--accent-soft:#e3efea;
--proposed:#6b4aa8;--accepted:#1f6f4a;--backlog:#9a5d00;--dismissed:#6b6b6b;--done:#1b5f8f;--major:#a3281f;--minor:#8a6a00;--polish:#46606b;--focus:#1b5f8f}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--panel:#201f1c;--fg:#efece6;--muted:#aaa59b;--line:#38352f;--accent:#7fc0ad;--accent-fg:#10201b;--accent-soft:#22332e;
--proposed:#b79af0;--accepted:#6fcf9f;--backlog:#e8b25c;--dismissed:#a0a0a0;--done:#7cc0ee;--major:#f08a80;--minor:#e0cf6a;--polish:#9bb8c4;--focus:#7cc0ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header.top{padding:22px 24px 0;max-width:1180px;margin:0 auto}
h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:0}h4{font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sub{color:var(--muted);margin:2px 0 0}
main{max-width:1180px;margin:0 auto;padding:8px 24px 80px}
button,input{font:inherit;color:inherit}
button{appearance:none;-webkit-appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border-radius:999px}
.tabs button[aria-selected=true],.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chips button{border-radius:999px;font-size:13px;padding:4px 12px;min-height:32px}
input[type=search]{appearance:none;-webkit-appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px;min-width:220px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.stat{font-size:30px;font-weight:650;line-height:1.1}.statlabel{color:var(--muted);font-size:13px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.st-hypothesis{color:var(--backlog);border-color:var(--backlog)}.pill.st-corroborated{color:var(--done);border-color:var(--done)}.pill.st-validated{color:var(--accepted);border-color:var(--accepted)}.pill.st-retired{color:var(--dismissed);border-color:var(--dismissed)}
.pill.s-proposed{color:var(--proposed);border-color:var(--proposed)}.pill.s-accepted{color:var(--accepted);border-color:var(--accepted)}.pill.s-backlog{color:var(--backlog);border-color:var(--backlog)}.pill.s-dismissed{color:var(--dismissed);border-color:var(--dismissed)}.pill.s-done{color:var(--done);border-color:var(--done)}
.pill.sev-major{color:var(--major);border-color:var(--major)}.pill.sev-minor{color:var(--minor);border-color:var(--minor)}.pill.sev-blocker{color:var(--major);border-color:var(--major)}.pill.sev-polish{color:var(--polish);border-color:var(--polish)}
.avatar{width:100%;max-width:240px;margin:0 auto 6px}.avatar svg{width:100%;height:auto;display:block;--ink:var(--fg);--paper:var(--panel);--accent:var(--accent)}.avatar.big{max-width:300px;float:right;margin:0 0 8px 16px}@media (max-width:640px){.avatar.big{float:none;margin:0 auto 8px}}.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.twin{text-align:left;width:100%;display:block;padding:14px 16px;border-radius:12px;min-height:0}
.twin[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.twin h3{margin-bottom:2px}
ul{margin:4px 0 4px 20px;padding:0}li{margin:2px 0}
.ev{border-top:1px solid var(--line);padding:8px 0}.ev:first-child{border-top:0}
.idchip{font-variant-numeric:tabular-nums;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);margin-right:6px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--panel)}
.matrix{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.matrix td.dot,.matrix th.dot{text-align:center;padding:6px 4px;min-width:38px}
.matrix th.dot button{padding:2px 6px;min-height:28px;font-size:12px;border-width:2px}
.dotmark{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.matrix tr.sel td{background:var(--accent-soft)}
.matrix tbody tr{cursor:pointer}
.rowbtn{all:unset;cursor:pointer;display:block}
.rowbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start}
.kan h3{display:flex;justify-content:space-between;margin-bottom:8px}
.kan .card{margin-bottom:8px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0}
pre.prompt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--accent)}
</style>
</head>

s (hypothesis, v0.1)"}, {"date": "2026-01-01", "scope": "study-001", "text": "Shelf prototype evaluation: 19 insights, 5 solutions proposed"}, {"date": "2026-01-01", "scope": "S1", "text": "accepted (sample)"}, {"date": "2026-01-01", "scope": "S2", "text": "backlog (sample)"}], "playbook": [{"level": "1 \u00b7 Set up", "scope": "broad", "title": "Find or create my library", "when": "First time, or at the start of any new session", "prompt": "Use Twinzies. Find or create my twin library. Tell me where it lives, how many twins, studies, insights and open solutions it holds, and rebuild the dashboard.", "output": "Library location, a one-line status, and a dashboard link."}, {"level": "2 \u00b7 Landscape", "scope": "broad", "title": "Plan the twin set for a new product", "when": "Starting a new app or site, before gathering anything", "prompt": "Use Twinzies. I'm starting a new [product type] for [audience and what they're trying to do]. Check my library for twins that already fit and show me a reuse / adapt / new plan, one line of reasoning each, plus the needs no twin covers yet. Don't build anything yet.", "output": "A table of reused, adapted and new twins and the gaps, so you decide how many twins you maintain."}, {"level": "3 \u00b7 Audience", "scope": "broad \u2192 mid", "title": "Build the missing twins", "when": "After you approve the plan", "prompt": "Use Twinzies to build the missing twins from the plan. Gather evidence from public sources and from the first-party material I'm attaching [feedback exports, support emails, interview notes]. Aim for [N] twins in total for this product. Show me the set, with options for splitting or merging, before saving.", "output": "New twins saved as hypotheses (v0.1) with an evidence log; unreachable sources listed."}, {"level": "4 \u00b7 Jobs & journeys", "scope": "mid", "title": "Map journeys for each twin", "when": "You want to know where each audience stalls before you test anything", "prompt": "Use Twinzies. Map the en G references."}, {"level": "8 \u00b7 Comparison", "scope": "specific", "title": "Compare two versions", "when": "You have two designs or two copy options", "prompt": "Use Twinzies. Compare [version A] and [version B] of [screen or flow] through [twins]. For [task], which would each twin prefer and why? Where do they disagree, and what would settle it?", "output": "Per-twin preference, tensions, and the real-user check that would settle it."}, {"level": "9 \u00b7 Validation plan", "scope": "specific", "title": "Turn predictions into a research plan", "when": "After an evaluation, before recruiting real people", "prompt": "Use Twinzies. Turn the top predictions from [study] into a validation plan for [product]. Offer me method options, then write a twin-match screener, task scenarios, in-product prompts with triggers, and a think-aloud script in [product]'s tone. State where and when each one is deployed.", "output": "A ready-to-deploy kit for the method you choose."}, {"level": "10 \u00b7 Log results", "scope": "specific", "title": "Log a study and map insights", "when": "You have sessions, survey answers or feedback to record", "prompt": "Use Twinzies. Log this study. Method and dates: [..]. Participants: [pseudonymous IDs, matched twin, recruiting source, no names or emails]. Results: [notes, transcripts or responses]. Confirm or contradict each prediction, list surprises, add insights with their evidence, and propose solutions. Update the dashboard.", "output": "Study record with participants, validated predictions, insights linked to evidence and solutions."}, {"level": "11 \u00b7 Decide", "scope": "decision", "title": "Review and decide on solutions", "when": "Insights and proposed solutions are waiting", "prompt": "Use Twinzies. Show me the proposed solutions for [product], most-supported first. For each, let me choose Do it, Dismiss or Backlog, one at a time, and record my choice and a note.", "output": "Each solution marked accepted, dismissed or backlog, wit <script>
const D = JSON.parse(document.getElementById('data').textContent);
const TABS = [['overview','Overview'],['twins','Twins'],['studies','Studies'],['map','Insight map'],['decisions','Decisions'],['changelog','Changelog'],['playbook','Research prompts']];
const S = {tab:'overview', product:'all', twin:null, insight:null, solution:null, status:'all', q:''};
const SEV = {blocker:0,major:1,minor:2,polish:3}, IMP = {high:0,medium:1,low:2};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr,id)=>arr.find(x=>x.id===id);
const twinName = id => (byId(D.twins,id)||{}).name || id;
const shortName = id => twinName(id).split(',')[0];
const inProd = p => S.product==='all' || p===S.product;
const insights = () => D.insights.filter(i=>{const st=byId(D.studies,i.study);return !st||inProd(st.product)});
const solutions = () => D.solutions.filter(s=>inProd(s.product));
const studies = () => D.studies.filter(s=>inProd(s.product));
const pill = (txt,cls) => `<span class="pill ${cls||''}">${esc(txt)}</span>`;
const STATUS_LABEL = {proposed:'Proposed',accepted:'Do it',backlog:'Backlog',dismissed:'Dismissed',done:'Done'};
const sPill = s => pill(STATUS_LABEL[s]||s,'s-'+s);
const evCount = ids => { const e=ids.map(i=>byId(D.evidence,i)).filter(Boolean); const c=t=>e.filter(x=>x.type===t).length; return {pub:c('public'),fp:c('first-party'),obs:c('product-observed')+c('study'),total:e.length}; };

function init(){
  const prods=[...new Set(D.studies.map(s=>s.product).concat(D.solutions.map(s=>s.product)))].filter(Boolean);
  document.getElementById('productChips').innerHTML = prods.length>1 ? ['all'].concat(prods).map(p=>`<button type="button" data-p="${esc(p)}" aria-pressed="${S.product===p}">${p==='all'?'All products':esc(p)}</button>`).join('') : '';
  document.getElementById('productChips').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.product=b.dataset.p;init();render()};
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=TABS.map(([k,l])=>`<button type="button" role="tab" id="tab-${k}" aria-selected="${S.tab===k}" tabindex="${S.tab===k?0:-1}" data-t="${k}">${l}</button>`).join('');
  tabs.onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
  tabs.onkeydown=e=>{const k=TABS.map(t=>t[0]);let i=k.indexOf(S.tab);if(e.key==='ArrowRight')i=(i+1)%k.length;else if(e.key==='ArrowLeft')i=(i+k.length-1)%k.length;else return;e.preventDefault();go(k[i]);document.getElementById('tab-'+k[i]).focus()};
  const real=studies().reduce((n,s)=>n+(s.real_participants||0),0);
  document.getElementById('subtitle').textContent=`${D.twins.length} twins · ${studies().length} ${studies().length===1?'study':'studies'} · ${real} real participants · ${insights().length} insights · ${solutions().length} solutions`;
}
function go(t){S.tab=t;init();render();window.scrollTo({top:0})}
function openInsight(id){S.insight=id;S.solution=null;go('map')}

function render(){
  const v=document.getElementById('view');
  v.setAttribute('aria-labelledby','tab-'+S.tab);
  v.innerHTML = ({overview,twins,studiesView,map,decisions,changelog,playbook})[S.tab==='studies'?'studiesView':S.tab]();
  bind(v);
}

function overview(){
  const tw=D.twins, so=solutions(), prop=so.filter(s=>s.status==='proposed').sort((a,b)=>b.insights.length-a.insights.length||IMP[a.impact]-IMP[b.impact]);
  const cnt=(arr,f)=>arr.filter(f).length;
  const real=studies().reduce((n,s)=>n+(s.real_participants||0),0);
  const tile=(n,l)=>`<div class="card"><div class="stat">${n}</div><div class="statlabel">${l}</div></div>`;
  const log=allLog().slice(0,6);
  return `<h2>Overview</h2>
  <div class="grid">${tile(tw.length,'twins')}${tile(studies().length,studies().length===1?'study':'studies')}${tile(real,'real participants')}${tile(insights().length,'insights')}${tile(prop.length,'solutions waiting for your decision')}</div>
  <h4>Twin status</h4><div class="row">${['hypothesis','corroborated','validated','retired'].map(s=>pill(cnt(tw,t=>t.status===s)+' '+s,'st-'+s)).join('')}</div>
  <p class="muted small">A twin is a hypothesis until real users or your own data back it up.</p>
  <h4>Needs your decision</h4>
  <div class="note">In your Claude session, say <strong>“Use Twinzies. Review and decide on solutions.”</strong> and choose Do it, Dismiss or Backlog for each.</div>
  ${prop.length?`<div class="grid">${prop.slice(0,6).map(s=>`<button type="button" class="card twin" data-sol="${s.id}"><div class="row">${sPill(s.status)}<span class="idchip">${s.id}</span><span class="pill">${s.insights.length} insights</span></div><h3 style="margin-top:6px">${esc(s.title)}</h3><div class="muted small">Impact ${esc(s.impact)} · effort ${esc(s.effort)}</div></button>`).join('')}</div>`:'<div class="empty">Nothing is waiting. Run an evaluation or log a study to generate new solutions.</div>'}
  <h4>Recent activity</h4>${log.length?`<div class="card">${log.map(l=>`<div class="ev"><span class="idchip">${esc(l.date)}</span>${l.scope?pill(l.scope)+' ':''}${esc(l.text)}</div>`).join('')}</div>`:'<div class="empty">No activity yet.</div>'}`;
}

function twins(){
  const sel=byId(D.twins,S.twin);
  const cards=D.twins.map(t=>{const e=D.evidence.filter(x=>(x.twins||[]).includes(t.id));const st=D.studies.filter(s=>(s.twins||[]).includes(t.id));
    return `<button type="button" class="card twin" data-twin="${esc(t.id)}" aria-pressed="${S.twin===t.id}">${t.avatar?`<div class="avatar" aria-hidden="true">${t.avatar}</div>`:''}<div class="row">${pill(t.status||'hypothesis','st-'+(t.status||'hypothesis'))}${pill('v'+(t.version||'?'))}</div><h3 style="margin-top:6px">${esc(t.name)}</h3><div class="muted small">${esc(t.archetype)}</div><div class="small" style="margin-top:8px">${e.length} evidence · ${st.length} ${st.length===1?'study':'studies'}</div><div class="row" style="margin-top:6px">${(t.needs||[]).slice(0,4).map(n=>pill(n)).join('')}</div></button>`}).join('');
  return `<h2>Twins</h2>${D.twins.length?`<div class="grid">${cards}</div>`:'<div class="empty">No twins yet. In your Claude session, say “Use Twinzies. Find or create my twin library.”</div>'}${sel?twinDetail(sel):''}`;
}
function twinDetail(t){
  const ev=D.evidence.filter(x=>(x.twins||[]).includes(t.id));
  const groups=[['public','Public sources'],['first-party','Your own data'],['product-observed','Seen in products'],['study','From studies']];
  const evHtml=groups.map(([k,l])=>{const items=ev.filter(x=>x.type===k);return items.length?`<h4>${l} (${items.length})</h4>`+items.map(x=>`<div class="ev"><span class="idchip">${esc(x.id)}</span><span class="small muted">${esc(x.community||'')} ${x.date?'· '+esc(x.date):''}</span><div>${esc(x.point)}</div>${/^https?:/.test(x.source||'')?`<a class="small" href="${esc(x.source)}" target="_blank" rel="noopener">source</a>`:''}</div>`).join(''):''}).join('')||'<div class="empty">No evidence recorded.</div>';
  const sts=D.studies.filter(s=>(s.twins||[]).includes(t.id));
  const myIns=D.insights.filter(i=>(i.twins||[]).includes(t.id));
  return `<div class="card" style="margin-top:16px" id="twinDetail"><div class="row">${pill(t.status||'hypothesis','st-'+(t.status||'hypothesis'))}${pill('v'+(t.version||'?'))}${pill((t.evidence_strength||'?')+' evidence')}${(t.last_validated&&!Array.isArray(t.last_validated))?pill('validated '+t.last_validated):pill('never validated with real users')}</div>
  ${t.avatar?`<div class="avatar big">${t.avatar}</div>`:''}<h2 style="margin-top:8px">${esc(t.name)}</h2><p class="muted">${esc(t.archetype)}</p><p class="muted small">Illustration is a visual archetype chosen for the twin, not evidence about real people.</p>${t.who?`<p>${esc(t.who)}</p>`:''}
  <div class="cols2"><div><h4>Goals</h4><ul>${(t.goals||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4>Pain points</h4><ul>${(t.pain_points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  <div class="cols2"><div><h4>Evidence</h4>${evHtml}</div>
  <div><h4>Studies (${sts.length})</h4>${sts.length?sts.map(s=>`<div class="ev"><strong>${esc(s.title)}</strong><div class="small muted">${esc(s.method)} · ${esc(s.date)}</div></div>`).join(''):'<div class="empty">Not in any study yet.</div>'}
  <h4>Insights involving this twin (${myIns.length})</h4>${myIns.slice(0,8).map(i=>`<div class="ev"><button type="button" class="rowbtn" data-ins="${i.id}"><span class="idchip">${i.id}</span>${esc(i.statement)}</button></div>`).join('')||'<span class="muted small">None yet.</span>'}
  <h4>Validation log</h4><ul>${(t.validation_log||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">None.</li>'}</ul>
  <h4>Changelog</h4><ul>${(t.changelog||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">None.</li>'}</ul></div></div></div>`;
}

function studiesView(){
  const ss=studies();
  if(!ss.length) return '<h2>Studies</h2><div class="empty">No studies yet. Evaluate a product or log a research round and it will appear here.</div>';
  return '<h2>Studies</h2>'+ss.map(s=>{
    const ins=D.insights.filter(i=>(s.insights||[]).includes(i.id)).sort((a,b)=>SEV[a.severity]-SEV[b.severity]);
    const parts=(s.participants||[]);
    return `<div class="card" style="margin-bottom:14px"><div class="row">${pill(s.status)}${pill(s.product)}<span class="muted small">${esc(s.date)}</span></div>
    <h3 style="margin-top:6px">${esc(s.title)}</h3><p class="muted" style="margin:2px 0 8px">${esc(s.method)}</p>
    <div class="cols2"><div><h4>Who took part</h4>${parts.length?`<table><thead><tr><th scope="col">ID</th><th scope="col">Matched twin</th><th scope="col">Source</th><th scope="col">Notes</th></tr></thead><tbody>${parts.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(shortName(p.twin||''))}</td><td>${esc(p.source||'')}</td><td>${esc(p.notes||'')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>No real participants yet.</strong><br>This study used ${(s.twins||[]).length} twins only: ${(s.twins||[]).map(t=>esc(shortName(t))).join(', ')}. Its findings are hypotheses until real people confirm them. Ask Claude: “Use Twinzies. Turn the top predictions from ${esc(s.title)} into a validation plan.”</div>`}
    <p class="muted small">Participants appear as pseudonymous IDs only. Keep names and emails outside this file.</p>
    ${(s.not_run||[]).length?`<h4>Not run</h4><ul class="small">${s.not_run.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>
    <div><h4>Key insights (${ins.length})</h4>${ins.slice(0,10).map(i=>`<div class="ev"><button type="button" class="rowbtn" data-ins="${i.id}"><div class="row">${pill(i.severity,'sev-'+i.severity)}${pill(i.confidence)}<span class="idchip">${i.id}</span></div>${esc(i.statement)}</button></div>`).join('')}${ins.length>10?`<p class="small muted">+${ins.length-10} more in the Insight map.</p>`:''}</div></div></div>`}).join('');
}

function map(){
  const sol=solutions();
  const q=S.q.toLowerCase();
  let ins=insights().filter(i=>!q||(i.statement+' '+i.where).toLowerCase().includes(q));
  if(S.status!=='all'){const ids=new Set(sol.filter(s=>s.status===S.status).flatMap(s=>s.insights));ins=ins.filter(i=>ids.has(i.id))}
  if(S.solution){const s=byId(D.solutions,S.solution);if(s)ins=ins.filter(i=>s.insights.includes(i.id))}
  const fl=['all','proposed','accepted','backlog','dismissed','done'];
  const head=sol.map(s=>`<th class="dot" scope="col"><button type="button" data-sol="${s.id}" title="${esc(s.title)}" aria-pressed="${S.solution===s.id}" style="border-color:var(--${s.status})">${s.id}</button></th>`).join('');
  const rows=ins.map(i=>{const c=evCount(i.evidence||[]);return `<tr data-ins="${i.id}" class="${S.insight===i.id?'sel':''}"><td><button type="button" class="rowbtn" data-ins="${i.id}"><span class="idchip">${i.id}</span>${esc(i.statement)}</button></td><td>${pill(i.severity,'sev-'+i.severity)}</td><td class="small">${(i.twins||[]).map(t=>esc(shortName(t))).join(', ')}</td><td class="small">${c.pub?c.pub+' public ':''}${c.fp?c.fp+' own-data ':''}${c.obs?c.obs+' observed':''}${c.total?'':'<span class="muted">none</span>'}</td>${sol.map(s=>`<td class="dot">${s.insights.includes(i.id)?`<span class="dotmark" role="img" aria-label="feeds ${s.id}"></span>`:''}</td>`).join('')}</tr>`}).join('');
  return `<h2>Insight map</h2><p class="muted">Each row is an insight with the evidence behind it; each column is a proposed solution. A dot means the insight feeds that solution. Several insights can feed one solution.</p>
  <div class="row"><div class="chips" role="group" aria-label="Filter by solution status" style="margin:0">${fl.map(f=>`<button type="button" data-status="${f}" aria-pressed="${S.status===f}">${f==='all'?'All solutions':STATUS_LABEL[f]}</button>`).join('')}</div><input type="search" id="q" placeholder="Search insights" aria-label="Search insights" value="${esc(S.q)}">${S.solution?`<button type="button" data-clear="1">Clear solution filter</button>`:''}</div>
  <div class="matrix" style="margin-top:10px"><table><thead><tr><th scope="col">Insight</th><th scope="col">Severity</th><th scope="col">Twins</th><th scope="col">Evidence</th>${head}</tr></thead><tbody>${rows||'<tr><td colspan="9" class="muted">No insights match.</td></tr>'}</tbody></table></div>
  ${mapDetail()}`;
}
function mapDetail(){
  const i=byId(D.insights,S.insight), s=byId(D.solutions,S.solution);
  if(s){const ins=D.insights.filter(x=>s.insights.includes(x.id));return `<div class="card" style="margin-top:14px"><div class="row">${sPill(s.status)}<span class="idchip">${s.id}</span>${pill('impact '+s.impact)}${pill('effort '+s.effort)}</div><h3 style="margin-top:6px">${esc(s.title)}</h3><p>${esc(s.detail)}</p><h4>Fed by ${ins.length} insight${ins.length===1?'':'s'}</h4>${ins.map(x=>`<div class="ev"><button type="button" class="rowbtn" data-ins="${x.id}"><span class="idchip">${x.id}</span>${esc(x.statement)}</button></div>`).join('')}${s.note?`<h4>Decision note</h4><p>${esc(s.note)}</p>`:''}</div>`}
  if(!i) return '<div class="empty" style="margin-top:14px">Select an insight or a solution to see the evidence and the links between them.</div>';
  const ev=(i.evidence||[]).map(id=>byId(D.evidence,id)).filter(Boolean);
  const feeds=D.solutions.filter(x=>x.insights.includes(i.id));
  return `<div class="card" style="margin-top:14px"><div class="row">${pill(i.severity,'sev-'+i.severity)}${pill(i.confidence)}${pill(i.lens)}<span class="idchip">${i.id}</span></div><h3 style="margin-top:6px">${esc(i.statement)}</h3><p class="muted small">${esc(i.where||'')}</p>
  <div class="cols2"><div><h4>Evidence (${ev.length})</h4>${ev.map(x=>`<div class="ev"><span class="idchip">${esc(x.id)}</span>${pill(x.type)}<div>${esc(x.point)}</div><div class="small muted">${esc(x.community||'')} ${x.date?'· '+esc(x.date):''} ${/^https?:/.test(x.source||'')?`· <a href="${esc(x.source)}" target="_blank" rel="noopener">source</a>`:''}</div></div>`).join('')||'<div class="empty">No evidence linked.</div>'}</div>
  <div><h4>Feeds solutions (${feeds.length})</h4>${feeds.map(x=>`<div class="ev"><button type="button" class="rowbtn" data-sol="${x.id}"><div class="row">${sPill(x.status)}<span class="idchip">${x.id}</span></div>${esc(x.title)}<div class="small muted">${x.insights.length} insights feed this</div></button></div>`).join('')||'<div class="empty">No solution yet. Ask Claude to propose one.</div>'}</div></div></div>`;
}

function decisions(){
  const sol=solutions(), cols=['proposed','accepted','backlog','dismissed','done'];
  return `<h2>Decisions</h2><div class="note">Decide in your Claude session: “Use Twinzies. Review and decide on solutions.” Claude asks for each one, saves your choice and a note, and rebuilds this page.</div>
  <div class="kan">${cols.map(c=>{const items=sol.filter(s=>s.status===c).sort((a,b)=>b.insights.length-a.insights.length);return `<section aria-label="${STATUS_LABEL[c]}"><h3><span>${STATUS_LABEL[c]}</span>${pill(items.length)}</h3>${items.map(s=>`<button type="button" class="card twin" data-sol="${s.id}"><div class="row"><span class="idchip">${s.id}</span>${pill(s.insights.length+' insights')}</div><div style="margin-top:6px"><strong>${esc(s.title)}</strong></div><div class="small muted">impact ${esc(s.impact)} · effort ${esc(s.effort)}${s.decided?' · '+esc(s.decided):''}</div>${s.note?`<div class="small" style="margin-top:4px">${esc(s.note)}</div>`:''}</button>`).join('')||'<div class="empty small">None</div>'}</section>`}).join('')}</div>`;
}

function allLog(){
  const out=D.log.map(l=>({date:l.date,scope:l.scope,text:l.text}));
  D.twins.forEach(t=>(t.changelog||[]).forEach(x=>{const m=x.match(/\((\d{4}-\d{2}-\d{2})\)/);out.push({date:m?m[1]:'',scope:t.name.split(',')[0],text:x})}));
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
function changelog(){
  const l=allLog();
  return `<h2>Changelog</h2>${l.length?`<div class="card">${l.map(x=>`<div class="ev"><span class="idchip">${esc(x.date||'undated')}</span>${x.scope?pill(x.scope)+' ':''}${esc(x.text)}</div>`).join('')}</div>`:'<div class="empty">No changes recorded yet.</div>'}`;
}

function playbook(){
  return `<h2>Research prompts</h2><p class="muted">Paste any of these into your Claude session, filled in with your own details. They run from broad to specific.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${D.playbook.map((p,i)=>`<div class="card"><div class="row">${pill(p.level)}${pill(p.scope)}</div><h3 style="margin-top:6px">${esc(p.title)}</h3><div class="small muted">${esc(p.when)}</div><pre class="prompt" id="pp${i}">${esc(p.prompt)}</pre><div class="small muted">You get: ${esc(p.output)}</div><div style="margin-top:8px"><button type="button" data-copy="pp${i}">Copy prompt</button></div></div>`).join('')}</div>`;
}

function bind(v){
  v.onclick=e=>{
    const b=e.target.closest('button,tr[data-ins]'); if(!b) return;
    if(b.dataset.twin){S.twin=S.twin===b.dataset.twin?null:b.dataset.twin;render();if(S.twin){const d=document.getElementById('twinDetail');d&&d.scrollIntoView({block:'start'})}}
    else if(b.dataset.ins){S.insight=b.dataset.ins;S.solution=null;if(S.tab!=='map'){go('map')}else render()}
    else if(b.dataset.sol){S.solution=S.solution===b.dataset.sol&&S.tab==='map'?null:b.dataset.sol;S.insight=null;if(S.tab!=='map'){go('map')}else render()}
    else if(b.dataset.status){S.status=b.dataset.status;render()}
    else if(b.dataset.clear){S.solution=null;render()}
    else if(b.dataset.copy){const t=document.getElementById(b.dataset.copy).textContent;const done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy prompt',1500)};
      if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,done);else{const r=document.createRange();r.selectNodeContents(document.getElementById(b.dataset.copy));const s=getSelection();s.removeAllRanges();s.addRange(r);done()}}
  };
  const q=document.getElementById('q'); if(q) q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
}
{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;const q=new URLSearchParams(location.search);if(q.get('twin'))S.twin=q.get('twin');if(q.get('ins'))S.insight=q.get('ins')}
init();render();
</script>
</body>
</html>
